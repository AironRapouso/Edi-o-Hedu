<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=block" rel="stylesheet">
<style>
@font-face{font-family:"Bebas Neue";src:url("bebas-neue-latin-400-normal.woff2") format("woff2");font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#010B25}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;
  background:radial-gradient(ellipse 560px 620px at 1050px 330px,#0A47B8 0%,rgba(4,87,231,.35) 45%,transparent 75%),linear-gradient(135deg,#031954 0%,#010B25 62%)}
.host{position:absolute;left:692px;top:-22px;width:820px;filter:drop-shadow(-14px 10px 24px rgba(0,4,20,.5))}
.fade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,transparent,rgba(1,11,37,.85))}
.tag{position:absolute;left:58px;top:30px;display:flex;align-items:center;gap:12px;font:700 19px/1 Inter;letter-spacing:4px;color:#5CA2EE}
.tag::before{content:"";width:44px;height:3px;background:#F4B04A}
.title{position:absolute;left:54px;top:60px;font-family:"Bebas Neue";text-transform:uppercase;white-space:nowrap}
.title span{display:block}
.l1{font-size:112px;line-height:.98;color:#F6F6F8;letter-spacing:1px}
.l2{font-size:128px;line-height:.94;color:#F4B04A;letter-spacing:1px}
.board{position:absolute;left:50px;top:298px;transform:scale(1.12);transform-origin:0 0;padding:16px 18px 18px;border-radius:14px;background:#020A22;border:1px solid rgba(92,162,238,.28);
  box-shadow:0 22px 44px rgba(0,3,18,.65)}
.bh{display:flex;justify-content:space-between;align-items:center;font:700 14px/1 Inter;letter-spacing:3.5px;color:#5CA2EE;margin:0 2px 12px 44px}
.bh b{color:#F4B04A;font-weight:700}
.r{display:flex;align-items:center;gap:4px;margin-top:5px}
.r:first-of-type{margin-top:0}
.n{width:38px;font:700 15px/1 Inter;color:#5CA2EE;letter-spacing:1px}
.c{position:relative;display:block;width:47px;height:45px;border-radius:5px;font:normal 400 41px/48px "Bebas Neue";text-align:center;color:#F6F6F8;
  background:linear-gradient(180deg,#1A2C66 0%,#12214F 50%,#0C1840 50%,#0A1436 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 0 rgba(0,0,0,.55)}
.c::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(1,6,22,.7)}
.c.e{background:linear-gradient(180deg,#131F4A 0%,#0E1840 50%,#0A1233 50%,#080F2B 100%)}
.c.q{margin-left:14px;width:58px;color:#031954;background:linear-gradient(180deg,#FBC76A 0%,#F4B04A 50%,#E39E36 50%,#DC9730 100%)}
.c.q::after{background:rgba(120,70,0,.55)}
.logo{position:absolute;right:26px;bottom:20px;display:flex;align-items:center;gap:8px;font:700 13px/1.15 Inter;letter-spacing:2px;color:#F6F6F8;opacity:.92}
.logo img{width:44px;height:44px;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 72%)}
</style></head><body><div class="stage">
<img class="host" src="helio_pro.png">
<div class="fade"></div>
<div class="tag">INTELIGÊNCIA ARTIFICIAL</div>
<div class="title"><span class="l1">QUAL PROFISSÃO VAI</span><span class="l2">ACABAR PRIMEIRO?</span></div>
<div class="board">
  <div class="bh"><span>NA FILA DA IA</span><b>É A PRÓXIMA?</b></div>
  <div class="r"><span class="n">01</span><i class="c">M</i><i class="c">É</i><i class="c">D</i><i class="c">I</i><i class="c">C</i><i class="c">O</i><i class="c e"></i><i class="c e"></i><i class="c e"></i><i class="c e"></i><i class="c q">?</i></div><div class="r"><span class="n">02</span><i class="c">E</i><i class="c">N</i><i class="c">F</i><i class="c">E</i><i class="c">R</i><i class="c">M</i><i class="c">E</i><i class="c">I</i><i class="c">R</i><i class="c">O</i><i class="c q">?</i></div><div class="r"><span class="n">03</span><i class="c">D</i><i class="c">E</i><i class="c">N</i><i class="c">T</i><i class="c">I</i><i class="c">S</i><i class="c">T</i><i class="c">A</i><i class="c e"></i><i class="c e"></i><i class="c q">?</i></div><div class="r"><span class="n">04</span><i class="c">A</i><i class="c">D</i><i class="c">V</i><i class="c">O</i><i class="c">G</i><i class="c">A</i><i class="c">D</i><i class="c">O</i><i class="c e"></i><i class="c e"></i><i class="c q">?</i></div><div class="r"><span class="n">05</span><i class="c">E</i><i class="c">N</i><i class="c">G</i><i class="c">E</i><i class="c">N</i><i class="c">H</i><i class="c">E</i><i class="c">I</i><i class="c">R</i><i class="c">O</i><i class="c q">?</i></div><div class="r"><span class="n">06</span><i class="c">P</i><i class="c">R</i><i class="c">O</i><i class="c">F</i><i class="c">E</i><i class="c">S</i><i class="c">S</i><i class="c">O</i><i class="c">R</i><i class="c e"></i><i class="c q">?</i></div>
</div>
<div class="logo"><img src="compass.png"><span>A NOVA ORDEM<br>EDUCACIONAL</span></div>
</div></body></html>
