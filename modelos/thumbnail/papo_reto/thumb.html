<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Kalam:wght@700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#010B25}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(ellipse 42% 58% at 50% 30%,#0A5CF0 0%,#031954 48%,#010B25 100%)}
.pan{position:absolute;top:0;height:720px;background-size:cover}
.pl{left:0;width:470px;background-image:url(bg_left.jpg);background-position:38% 30%;clip-path:polygon(0 0,100% 0,78% 100%,0 100%);filter:saturate(.8) contrast(1.15) brightness(1.25)}
.pr{right:0;width:470px;background-image:url(bg_right.jpg);background-position:78% 50%;clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);filter:saturate(.7) contrast(1.15) brightness(.6)}
.tint{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,25,84,.35),rgba(1,11,37,0) 30%,rgba(1,11,37,0) 70%,rgba(3,25,84,.35));mix-blend-mode:multiply}
.blue{position:absolute;inset:0;background:#0457E7;mix-blend-mode:soft-light;opacity:.5}
svg.ln{position:absolute;inset:0}
.host{position:absolute;left:10px;top:-118px;width:1260px;filter:drop-shadow(0 0 26px rgba(24,146,240,.6)) drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.fade{position:absolute;left:0;right:0;bottom:0;height:440px;background:linear-gradient(180deg,rgba(1,11,37,0) 0%,rgba(1,11,37,.85) 36%,#010B25 74%)}
.bub{position:absolute;left:36px;top:44px;transform:rotate(-5deg);font:700 54px/1.05 Kalam;color:#fff;text-shadow:0 0 12px rgba(24,146,240,.9),0 3px 0 #010B25}
.zero{position:absolute;right:54px;top:60px;transform:rotate(8deg)}
.t{position:absolute;left:0;right:0;text-align:center;font-family:Montserrat;font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-1px;white-space:nowrap}
.w{color:#fff;font-size:54px;-webkit-text-stroke:2px #010B25;paint-order:stroke fill;text-shadow:0 4px 0 #010B25,0 0 18px rgba(0,0,0,.85)}
.g{font-size:108px;background:linear-gradient(180deg,#FFE08A 0%,#F4B04A 45%,#C27A12 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #3a2203) drop-shadow(0 0 16px rgba(0,0,0,.75))}
.b{font-size:108px;background:linear-gradient(180deg,#5CC1FF 0%,#1892F0 40%,#0457E7 100%);-webkit-background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 5px 0 #010B25) drop-shadow(0 0 3px #9fd6ff) drop-shadow(0 0 20px rgba(4,87,231,.9))}
.bar{position:absolute;height:4px;background:linear-gradient(90deg,transparent,#F4B04A,transparent)}
</style></head><body><div class="stage">
<div class="pan pl"></div><div class="pan pr"></div>
<div class="blue"></div><div class="tint"></div>
<svg class="ln" viewBox="0 0 1280 720"><path d="M470 0L367 720" stroke="#F4B04A" stroke-width="4"/><path d="M913 0L810 720" stroke="#F4B04A" stroke-width="4"/></svg>
<div class="bub">e se eu<br>errar?</div>
<svg class="zero" width="190" height="190" viewBox="0 0 190 190" fill="none" stroke="#FF3B30" stroke-width="11" stroke-linecap="round"><path d="M96 14C40 10 12 52 16 100c4 50 40 78 84 74 46-4 76-40 72-90C168 40 140 14 92 18"/><path d="M96 58c-18 0-26 18-26 38s8 38 26 38 26-18 26-38-8-38-26-38z" stroke-width="12"/></svg>
<img class="host" src="host_cine.png">
<div class="fade"></div>
<div class="t w" style="top:366px">Você sabia a resposta</div>
<div class="t g" style="top:416px">e ficou quieto.</div>
<div class="bar" style="left:120px;width:230px;top:557px"></div><div class="bar" style="right:120px;width:230px;top:557px"></div>
<div class="t w" style="top:532px">o nome disso é</div>
<div class="t b" style="top:580px">medo de errar</div>
</div></body></html>
